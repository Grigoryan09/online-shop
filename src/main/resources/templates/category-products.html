<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Товары категории</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
    <th:block th:insert="fragments/hiderFragments::header"></th:block>
<div class="container mt-5">
    <h1>Товары категории</h1>
    <div class="row" th:if="${products}">
        <div class="col-md-4 mb-3" th:each="product : ${products}">
            <div class="card h-100">
                <img th:if="${product.pictureName}"
                     th:src="@{/image/get(pic=${product.pictureName})}"
                     class="card-img-top" alt="Изображение товара" />
                <img th:unless="${product.pictureName}"
                     src="https://via.placeholder.com/150"
                     class="card-img-top" alt="Нет изображения" />
                <div class="card-body">
                    <h5 th:text="${product.title}">Название товара</h5>
                    <p><strong>Цена:</strong> <span th:text="${product.price}"></span> руб.</p>
                    <a th:href="@{/user/product/{id}(id=${product.id})}" class="btn btn-primary">Подробнее</a>
                </div>
            </div>
        </div>
    </div>
    <a href="/" class="btn btn-secondary mt-3">Вернуться на главную</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
