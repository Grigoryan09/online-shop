<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товар</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<th:block th:insert="fragments/hiderFragments::header"></th:block>
<div class="container mt-5">
    <div class="row" th:if="${product}">
        <div class="col-md-6">
            <img th:if="${product.pictureName}"
                 th:src="@{/image/get(pic=${product.pictureName})}"
                 class="img-fluid" alt="Товар">
            <img th:unless="${product.pictureName}"
                 src="https://via.placeholder.com/400"
                 class="img-fluid" alt="Нет изображения">
        </div>
        <div class="col-md-6">
            <h1 th:text="${product.title}"></h1>
            <p class="lead">
                <strong th:text="#{price}">Цена:</strong>
                <span th:text="${product.price}"></span>
                <span th:text="#{rub}"></span>
            </p>
            <p><strong th:text="#{category}">Категория:</strong> <span th:text="${product.category.name}"></span></p>
            <p><strong th:text="#{description}">Описание:</strong> <span th:text="${product.description}"></span></p>
        </div>
    </div>

    <div class="row mt-5">
        <div class="col-md-12">
            <h3 th:text="#{comments}">Комментарии</h3>
            <div th:if="${product}" class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title" th:text="#{add.comment}">Добавить комментарий</h5>
                    <form th:action="@{/comment/add}" method="post">
                        <input type="hidden" name="productId" th:value="${product.id}">
                        <div class="mb-3">
                            <label for="comment" class="form-label" th:text="#{your.comment}">Ваш комментарий</label>
                            <textarea id="comment" name="comment" class="form-control" rows="3" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" th:text="#{send}">Отправить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${product.comments}">
        <h4 th:text="#{reviews}">Отзывы</h4>
        <ul class="list-group">
            <li class="list-group-item" th:each="comment : ${product.comments}">
                <strong th:text="${comment.user.name}">Имя пользователя</strong>:
                <span th:text="${comment.comment}">Текст комментария</span>
                <form th:action="@{'/comment/' + ${comment.id} + '/delete'}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-sm btn-danger" th:text="#{delete}">Удалить</button>
                </form>
            </li>
        </ul>
    </div>

    <div class="row mt-3">
        <div class="col-md-12">
            <a href="/" class="btn btn-secondary" th:text="#{back.home}">Вернуться на главную</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
