<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<th:block th:insert="fragments/hiderFragments::header"></th:block>
<div class="container mt-5">
    <div class="row">
        <div class="col-md-12">
            <h2 class="mb-4"
                th:if="${user != null}"
                th:text="'Добро пожаловать ' + ${user.name} + ' ' + ${user.surname}">
            </h2>

            <h2 class="mb-4" th:unless="${user != null}">
                Добро пожаловать в наш онлайн магазин!
            </h2>
            <p class="lead">Выберите товар из категорий ниже</p>
        </div>
    </div>

    <div class="row" th:if="${categories}">
        <div th:each="category : ${categories}" class="col-md-3 mb-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title" th:text="${category.name}"></h5>
                    <a th:href="@{/category/{id}/products(id=${category.id})}" class="btn btn-primary">Просмотреть</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
