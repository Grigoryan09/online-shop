<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Online Shop</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/logout}" th:if="${user}">Выход</a></li>
                <li class="nav-item"><a class="nav-link" href="/login" th:unless="${user}">Вход</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-12">
            <h1 class="mb-4">Добро пожаловать в Online Shop</h1>
            <p class="lead">Выберите товар из категорий ниже</p>
        </div>
    </div>

    <div class="row" th:if="${categories}">
        <div th:each="category : ${categories}" class="col-md-3 mb-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title" th:text="${category.name}"></h5>
                    <a th:href="@{/category/{id}/products(id=${category.id})}" class="btn btn-primary">Просмотреть</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
