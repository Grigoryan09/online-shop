<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<div th:fragment="header">
    <a href="?lang=en">EN</a> |
    <a href="?lang=ru">RU</a> |
    <a href="?lang=hy">HY</a> <br>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/" th:text="#{app.title}"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/logout}" th:if="${user}" th:text="#{logout}"></a></li>
                    <li class="nav-item"><a class="nav-link" href="/login" th:unless="${user}" th:text="#{login}"></a></li>
                </ul>
            </div>
        </div>
    </nav>
</div>

<div th:fragment="adminHider">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a href="?lang=en">EN</a> |
        <a href="?lang=ru">RU</a> |
        <a href="?lang=hy">HY</a> <br>
        <div class="container">
            <a class="navbar-brand" href="/admin/home" th:text="#{app.title} + ' - ' + #{admin.role}"></a>
            <div class="ms-auto">
                <a href="/logout"class="btn btn-outline-light" th:text="#{logout}"></a>
            </div>
        </div>
    </nav>
</div>
</body>
</html>
