<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товары</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Online Shop - Админ</a>
        <div class="ms-auto">
            <a href="/logout" class="btn btn-outline-light">Выход</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-12">
            <h1 class="mb-4">Управление товарами</h1>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-12">
            <a href="/admin/products/add" class="btn btn-success">+ Добавить товар</a>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header bg-secondary text-white">
                    <h5>Список товаров</h5>
                </div>
                <div class="card-body">
                    <table class="table table-striped" th:if="${not #lists.isEmpty(products)}">
                        <thead>
                            <tr>
                                <th>Picture</th>
                                <th>ID</th>
                                <th>Название</th>
                                <th>Цена</th>
                                <th>Категория</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="product : ${products}">
                                <td>
                                    <img th:src="${product.pictureName != null && product.pictureName != ''} ?
                  @{/image/get(pic=${product.pictureName})} :
                  @{/imagess/img.png}"
                                         width="50"/>
                                </td>
                                <td th:text="${product.id}"></td>
                                <td th:text="${product.title}"></td>
                                <td th:text="${product.price}"></td>
                                <td th:text="${product.category != null ? product.category.name : 'N/A'}"></td>
                                <td>
                                    <a th:href="@{'/admin/products/edit/' + ${product.id}}" class="btn btn-sm btn-warning">Редактировать</a>
                                    <a th:href="@{'/admin/products/delete/' + ${product.id}}" class="btn btn-sm btn-danger" onclick="return confirm('Вы уверены?')">Удалить</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div th:if="${#lists.isEmpty(products)}" class="alert alert-info">
                        Товаров не найдено
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-md-12">
            <a href="/admin/home" class="btn btn-secondary">Вернуться в админ-панель</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
