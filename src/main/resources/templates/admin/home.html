<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/static">Online Shop - Админ</a>
        <div class="ms-auto">
            <a href="/logout" class="btn btn-outline-light">Выход</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-12">
            <h1 class="mb-4">Админ-панель</h1>
        </div>
    </div>

    <div class="row">
        <div class="col-md-4">
            <div class="card text-white bg-primary mb-3">
                <div class="card-body">
                    <h5 class="card-title">Категории</h5>
                    <p class="card-text" th:text="'Всего: ' + ${categories.size()}"></p>
                    <a href="/admin/categories" class="btn btn-light btn-sm">Управление</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-success mb-3">
                <div class="card-body">
                    <h5 class="card-title">Товары</h5>
                    <p class="card-text" th:text="'Всего: ' + ${products.size()}"></p>
                    <a href="/admin/products" class="btn btn-light btn-sm">Управление</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-warning mb-3">
                <div class="card-body">
                    <h5 class="card-title">Пользователи</h5>
                    <p class="card-text" th:text="'Всего: ' + ${users.size()}"></p>
                    <a href="/admin/users" class="btn btn-light btn-sm">Управление</a>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-5">
        <div class="col-md-12">
            <h2>Статистика</h2>
            <p>Используйте меню выше для управления категориями, товарами и пользователями.</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
