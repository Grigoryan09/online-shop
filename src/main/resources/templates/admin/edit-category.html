<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактировать категорию</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<th:block th:insert="fragments/hiderFragments::adminHider"></th:block>
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 mx-auto">
            <div class="card">
                <div class="card-header bg-warning text-dark">
                    <h5>Редактировать категорию</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/categories/update}" method="post">
                        <input type="hidden" th:name="id" th:value="${category.id}">
                        <div class="mb-3">
                            <label for="name" class="form-label">Название</label>
                            <input type="text" id="name" th:name="name" th:value="${category.name}" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-warning">Сохранить</button>
                        <a href="/admin/categories" class="btn btn-secondary">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
